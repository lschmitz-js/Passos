# Homelab variant, for CTPASSOS (10.0.0.151) on Proxmox.
#
# Differs from docker-compose.yml (the GCP VM) in one way that matters: there,
# Caddy was a container in the same stack and reached the app over the shared
# `racha_default` network as `passos:8080`. Here Caddy lives in a separate LXC
# (CTCADDY, 10.0.0.57), so the port is published on the LAN interface instead.
#
# Deploy:  docker compose -f docker-compose.home.yml up -d --build passos
services:
  passos:
    build: .
    image: passos:latest
    container_name: passos
    restart: unless-stopped
    ports:
      - "10.0.0.151:8080:8080"
    volumes:
      - /opt/passos/data:/data
    environment:
      DB_PATH: /data/passos.db

  passos-collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: passos-collector:latest
    container_name: passos-collector
    restart: unless-stopped
    volumes:
      - /opt/passos/data:/data
    environment:
      DB_PATH: /data/passos.db
      TOKENSTORE: /data/.garminconnect
      NAMES_FILE: /data/names.json
      INTERVAL_SECONDS: "3600"
      LOOKBACK_DAYS: "7"
    depends_on:
      - passos
