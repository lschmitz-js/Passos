# Runs on CTPASSOS (10.0.0.151), an LXC on the Proxmox node `mgm`.
#
# Caddy lives in a separate container (CTCADDY, 10.0.0.57) and reaches the app
# over the LAN, so the port is published on the LAN interface. The previous GCP
# deployment instead shared a docker network with Caddy and resolved
# `passos:8080`; see git history if that setup is ever needed again.
#
# Deploy:  docker compose up -d --build
services:
  passos:
    build: .
    image: passos:latest
    container_name: passos
    restart: unless-stopped
    ports:
      - "10.0.0.151:8080:8080"
    volumes:
      - /opt/passos/data:/data
    environment:
      DB_PATH: /data/passos.db

  passos-collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: passos-collector:latest
    container_name: passos-collector
    restart: unless-stopped
    volumes:
      - /opt/passos/data:/data
    environment:
      DB_PATH: /data/passos.db
      TOKENSTORE: /data/.garminconnect
      NAMES_FILE: /data/names.json
      INTERVAL_SECONDS: "3600"
      LOOKBACK_DAYS: "7"
    depends_on:
      - passos
